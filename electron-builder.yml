appId: com.ethanlin.baguette
productName: baguette
copyright: Copyright © Ethan Lin

directories:
  buildResources: build
  output: release

# Only the built output and the runtime deps go in; src/ and the whole
# tools/ short-path workaround are build-time only.
files:
  - out/**/*
  - package.json

# The tray icon and notification icon are read at runtime from
# process.resourcesPath (see main/tray.ts appIconPath), so the .ico has to
# travel outside the asar as a plain file.
extraResources:
  - from: build/icon.ico
    to: icon.ico

# Updates come from this repo's GitHub Releases (main/updater.ts). Declaring
# the provider makes electron-builder emit latest.yml (version + sha512 of the
# installer) next to the .exe; .github/workflows/release.yml uploads both to
# the Release and the app verifies the download against it. Uploading is done
# by that workflow, not by electron-builder (`--publish never`).
publish:
  provider: github
  owner: Lucker030
  repo: baguette

# The only native dependency is node-pty, and its binary is ABI-stable across
# Node and Electron (verified: the same .node loads under both), so there is
# nothing to rebuild. Letting electron-builder try anyway fails outright here —
# it shells out to node-gyp, which needs a full Visual Studio toolchain that
# isn't installed, and node-gyp EMPTIES node-pty's build/ directory before it
# fails, which breaks `npm run dev` too. Recover with:
#   rm -r node_modules/@homebridge && npm install
#
# Note the Windows binary is NOT in the published tarball (its `prebuilds/`
# ships Linux only) — the package's install script downloads it into
# build/Release/. So `npm ci --ignore-scripts` produces a package whose
# terminals all fail at runtime, quietly, via the node-pty load-error toast.
npmRebuild: false

# node-pty ships a native .node plus winpty-agent.exe / conpty helpers that
# must exist as real files on disk — they cannot be loaded from inside the
# asar archive.
asar: true
asarUnpack:
  - '**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per-user install: no UAC prompt, and it lands in %LOCALAPPDATA% so the
  # installed app never sits under a path we don't control.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: baguette
  # No spaces: GitHub rewrites spaces in uploaded asset names to dots, which
  # would no longer match the `path:` in latest.yml. updater.ts INSTALLER_RE
  # matches this name.
  artifactName: baguette-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
